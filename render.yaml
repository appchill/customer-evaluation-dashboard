services:
  - type: web
    name: customer-evaluation-dashboard
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: customer-data
      mountPath: /data
      sizeGB: 1
